<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Entrevista — Analista de Soporte</title>
<style>
  :root { --azul:#0d2b45; --azul2:#17456e; --accent:#2c6e9c; --ok:#2e7d32; --bad:#c62828; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Helvetica, Arial, sans-serif; background:#eef2f7; color:#1a1a1a; line-height:1.5; padding-bottom:40px; }
  header { background:linear-gradient(135deg,#0d2b45,#2c6e9c); color:#fff; padding:22px 16px 18px; text-align:center; }
  header h1 { font-size:20px; margin-bottom:4px; }
  header p { font-size:13px; opacity:.85; }
  .best { display:inline-block; margin-top:8px; background:rgba(255,255,255,.15); border-radius:20px; padding:4px 14px; font-size:13px; font-weight:600; }
  .wrap { max-width:640px; margin:0 auto; padding:16px; }
  .card { background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(13,43,69,.12); padding:18px; margin-bottom:14px; }
  .progress { height:8px; background:#dbe4ee; border-radius:6px; overflow:hidden; margin-bottom:12px; }
  .progress div { height:100%; background:linear-gradient(90deg,#2c6e9c,#4a9bc9); transition:width .3s; }
  .meta { display:flex; justify-content:space-between; font-size:12px; color:#5a6b7c; margin-bottom:10px; font-weight:600; }
  .q { font-size:16px; font-weight:700; color:var(--azul); margin-bottom:12px; }
  .opt { display:block; width:100%; text-align:left; background:#f4f7fb; border:2px solid #dbe4ee; border-radius:10px; padding:12px 14px; margin-bottom:8px; font-size:14px; cursor:pointer; transition:.15s; font-family:inherit; color:#1a1a1a; }
  .opt:hover { border-color:var(--accent); background:#eaf2f9; }
  .opt.correct { border-color:var(--ok); background:#e8f5e9; font-weight:700; }
  .opt.wrong { border-color:var(--bad); background:#ffebee; }
  .opt:disabled { cursor:default; opacity:.9; }
  .expl { display:none; border-radius:10px; padding:12px 14px; margin-top:8px; font-size:14px; }
  .expl.show { display:block; }
  .expl.good { background:#e8f5e9; border-left:4px solid var(--ok); }
  .expl.bad { background:#ffebee; border-left:4px solid var(--bad); }
  .expl p { margin-bottom:4px; }
  .btn { display:inline-block; background:var(--azul2); color:#fff; border:none; border-radius:10px; padding:12px 26px; font-size:15px; font-weight:700; cursor:pointer; margin-top:12px; }
  .btn:hover { background:var(--azul); }
  .btn:disabled { opacity:.4; cursor:default; }
  /* Resultado */
  .score-big { font-size:52px; font-weight:800; text-align:center; color:var(--azul); }
  .grade { text-align:center; font-size:20px; font-weight:700; margin-bottom:6px; }
  .verdict { text-align:center; font-size:14px; color:#5a6b7c; margin-bottom:14px; }
  .secbar { margin-bottom:10px; }
  .secbar .row { display:flex; justify-content:space-between; font-size:13px; font-weight:600; margin-bottom:3px; }
  .secbar .track { height:7px; background:#dbe4ee; border-radius:5px; overflow:hidden; }
  .secbar .track div { height:100%; background:var(--accent); }
  .mistake { background:#fdf3e7; border-left:4px solid #e69138; border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px; }
  .mistake b { color:var(--bad); }
  .center { text-align:center; }
  .small { font-size:12px; color:#5a6b7c; }
</style>
</head>
<body>

<header>
  <h1>📋 Quiz Entrevista — Analista de Soporte</h1>
  <p>30 preguntas basadas en la guía · Respuesta inmediata + nota final</p>
  <div class="best" id="bestBox">Mejor nota: —</div>
</header>

<div class="wrap">
  <div class="card" id="quizCard">
    <div class="progress"><div id="pbar" style="width:0%"></div></div>
    <div class="meta"><span id="secLabel">—</span><span id="counter">1 / 30</span></div>
    <div class="q" id="qText"></div>
    <div id="opts"></div>
    <div class="expl" id="expl"></div>
    <div class="center"><button class="btn" id="nextBtn" disabled onclick="next()">Siguiente →</button></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <div class="center">
      <div class="score-big" id="scoreNum">0</div>
      <div class="grade" id="gradeLabel">—</div>
      <div class="verdict" id="verdict">—</div>
    </div>
    <div id="secResults"></div>
    <div id="mistakes"></div>
    <div class="center">
      <button class="btn" onclick="restart()">🔄 Reintentar</button>
    </div>
    <p class="center small" style="margin-top:10px">Tip: repasá las que fallaste en la guía y volvé a intentar hasta llegar a 90+.</p>
  </div>
</div>

<script>
const QS = [
{s:"El puesto", q:"¿Cuál es el rol principal del puesto de Analista de Soporte?", o:["Construir dashboards de Power BI","Ser el primer punto de contacto de las solicitudes de soporte entrantes","Gestionar las redes sociales de la empresa","Hacer auditorías de datos"], a:1, e:"El puesto es la puerta de entrada de todos los tickets: portal de operaciones, reportes KPI, BI, accesos y nuevas funcionalidades."},
{s:"El puesto", q:"¿Por qué es crítico procesar los incidentes con prontitud?", o:["Porque los clientes se enojan rápido","Los retrasos pueden afectar la toma de decisiones informada y la adopción de herramientas","Porque el gerente lo pide","Para cumplir con el horario"], a:1, e:"La descripción lo dice: los retrasos afectan las decisiones informadas y la adopción de herramientas. Esa es la frase que hay que usar."},
{s:"El puesto", q:"¿Cuáles son los tipos de tickets que atiende este puesto?", o:["Solo reportes de ventas","Plataformas, informes de KPI, herramientas de BI, gestión de acceso y nuevas funcionalidades","Solo problemas de hardware","Únicamente solicitudes de vacaciones"], a:1, e:"Los 5 tipos: plataformas, reportes de KPI, herramientas de BI, gestión de acceso y solicitudes de nuevas funcionalidades."},
{s:"El puesto", q:"¿Qué hay que asegurar al recibir un ticket?", o:["Responder lo más rápido posible sin preguntar","Recopilar información completa del solicitante","Cerrarlo de inmediato","Reenviarlo al primer correo disponible"], a:1, e:"Información completa (qué, desde cuándo, a quién afecta, capturas) para que el ticket se resuelva sin ir y venir."},
{s:"Ciclo del ticket", q:"¿Cuál es el orden correcto del ciclo de vida de un ticket?", o:["Clasificación → Recepción → Cierre → Resolución","Recepción → Clasificación → Priorización → Asignación → Resolución → Comunicación → Cierre","Priorización → Recepción → Asignación → Clasificación","Recepción → Cierre → Documentación → Escalamiento"], a:1, e:"Los 7 pasos: recepción, clasificación, priorización, asignación, resolución, comunicación y cierre."},
{s:"Ciclo del ticket", q:"¿Qué determina la prioridad de un ticket?", o:["El orden de llegada","El nombre del solicitante","El impacto × la urgencia","La antigüedad del usuario"], a:2, e:"Impacto × urgencia → P1/P2/P3/P4. No es por orden de llegada."},
{s:"Ciclo del ticket", q:"Un dashboard de KPI está caído y un gerente lo necesita para una reunión en 1 hora. ¿Qué prioridad le das?", o:["P4 — se agenda para la próxima semana","P3 — se atiende en el día","P2 — se atiende en 8 horas","P1 — crítica, respuesta inmediata"], a:3, e:"Bloquea una decisión gerencial: P1, respuesta inmediata. Prioridad por impacto y urgencia."},
{s:"Ciclo del ticket", q:"Una solicitud de nueva funcionalidad ('¿se puede agregar un filtro por región?') ¿cómo se prioriza?", o:["P1 crítica","P2 alta","P3 media","P4 baja — planificada / backlog"], a:3, e:"Las mejoras y solicitudes nuevas son P4: van al backlog con expectativas claras."},
{s:"Ciclo del ticket", q:"¿Cuál es la diferencia entre un incidente y una solicitud?", o:["Son lo mismo","Incidente = algo está roto; solicitud = se pide algo nuevo (acceso, funcionalidad)","Incidente = correo; solicitud = teléfono","Incidente = interno; solicitud = externo"], a:1, e:"Incidente: servicio no funciona. Solicitud: pedido de algo nuevo. Cada uno tiene su proceso."},
{s:"Ciclo del ticket", q:"¿Cuándo se escala un ticket y cómo se hace?", o:["Cuando me da pereza resolverlo","Nunca se escala","Cuando vence el tiempo, requiere nivel 2/3 o crece el impacto — SIEMPRE con contexto","Solo si el usuario es gerente"], a:2, e:"Escalar con contexto: qué se probó, qué se encontró, qué necesita el siguiente nivel."},
{s:"Jira", q:"¿Qué es Jira?", o:["Una base de datos","Una herramienta de seguimiento de trabajo e incidencias (de Atlassian)","Un lenguaje de programación","Un antivirus"], a:1, e:"Jira gestiona issues/tickets con tableros, prioridades y workflows."},
{s:"Jira", q:"En Jira, ¿cómo se llama un ticket o tarea?", o:["Post","Issue","Card","Slide"], a:1, e:"El elemento central de Jira es el 'issue'. Tipos: Bug, Task, Story, Epic."},
{s:"Jira", q:"¿Qué es un tablero Kanban en Jira?", o:["Un tablero con columnas (To Do → In Progress → Done) de flujo continuo","Un informe financiero","Una base de conocimiento","Un chat de equipo"], a:0, e:"Kanban visualiza el flujo continuo de trabajo; Scrum usa sprints con ciclos."},
{s:"Jira", q:"¿Qué es ServiceNow?", o:["Un juego de mesa","Una plataforma de ITSM (IT Service Management) para la mesa de servicio empresarial","Un editor de fotos","Una red social"], a:1, e:"ServiceNow gestiona incidentes, solicitudes, cambios y SLAs en empresas grandes."},
{s:"Jira", q:"En ServiceNow, ¿qué mide y alerta los tiempos comprometidos de atención?", o:["La memoria del servidor","El módulo de nómina","Los SLAs automáticos","El historial de chat"], a:2, e:"Los SLAs miden tiempos de respuesta y resolución automáticamente."},
{s:"Jira", q:"¿Para qué sirve la Knowledge Base (KB) en soporte?", o:["Para guardar contraseñas","Para consultar soluciones ya documentadas y resolver más rápido","Para enviar correos masivos","Para calcular salarios"], a:1, e:"La KB es la primera parada: si la solución ya existe, no se reinicia el problema."},
{s:"Power BI", q:"¿Con qué lenguaje se crean las medidas en Power BI?", o:["SQL","Python","DAX","Java"], a:2, e:"DAX (SUM, CALCULATE, TOTALYTD...). Las medidas son los cálculos del dashboard."},
{s:"Power BI", q:"Un usuario dice 'el reporte está desactualizado'. ¿Qué revisás primero?", o:["El cable de red","El refresh (actualización programada) de los datos","El color del dashboard","El antivirus"], a:1, e:"Los datos se actualizan en horarios (refresh). Reporte viejo = problema de refresh o del pipeline."},
{s:"Power BI", q:"¿Cómo se gestiona el acceso a un dashboard en Power BI?", o:["Con roles de workspace y RLS (Row-Level Security)","Con contraseñas en un Excel","Nadie puede ver dashboards","Solo el gerente decide"], a:0, e:"Roles de workspace (Viewer/Contributor/Admin) + RLS para limitar filas por usuario."},
{s:"Power BI", q:"¿Qué es Power Query en Power BI?", o:["Un lenguaje para crear medidas","La herramienta para extraer y transformar datos antes de cargarlos","Un conector de impresoras","Un tema de color"], a:1, e:"Power Query hace el 'E' y 'T' del ETL: extraer y transformar antes de cargar."},
{s:"Tableau", q:"En Tableau, ¿cuál es la diferencia entre una dimensión y una medida?", o:["No hay diferencia","Dimensión = dato numérico; medida = texto","Dimensión = categoría/texto (ej: región); medida = número (ej: ingresos)","Dimensión = tabla; medida = gráfico"], a:2, e:"Dimensiones agrupan (texto/categoría), medidas se calculan (números)."},
{s:"Tableau", q:"¿En qué es más fuerte Power BI que Tableau?", o:["En visualización libre","En reporting corporativo integrado con el ecosistema Microsoft/Excel y DAX","En animaciones 3D","En edición de video"], a:1, e:"Power BI brilla en reporting corporativo e integración Microsoft; Tableau en exploración visual."},
{s:"Conceptos", q:"¿Qué es un KPI?", o:["Un virus informático","Una métrica ligada a un objetivo de negocio","Un tipo de ticket","Un lenguaje de programación"], a:1, e:"Indicador Clave de Rendimiento: mide si se cumple un objetivo (ej: No-Show rate, satisfacción)."},
{s:"Conceptos", q:"¿Qué es un SLA?", o:["Un acuerdo de nivel de servicio: tiempos comprometidos de respuesta y resolución","Una base de datos","Un tipo de gráfico","Una encuesta"], a:0, e:"El SLA es la promesa medible: responder en X, resolver en Y."},
{s:"Conceptos", q:"¿Qué es un workaround?", o:["Una solución temporal mientras se corrige la causa raíz","Un reporte semanal","Un permiso de acceso","Un error crítico"], a:0, e:"Se deja un workaround funcionando y se sigue con la causa raíz."},
{s:"Conceptos", q:"¿Qué significa ETL?", o:["Extraer, Transformar, Cargar — el pipeline que alimenta los dashboards","Editar, Traducir, Limpiar","Enviar, Transferir, Leer","Evaluar, Testear, Lanzar"], a:0, e:"Construiste pipelines ETL con Python y n8n: es tu carta para hablar con propiedad de datos."},
{s:"Escenarios", q:"Un usuario llega molesto porque su reporte no funciona. ¿Qué hacés primero?", o:["Le digo que espere su turno","Escucho, reconozco la frustración, separo la persona del problema y doy un plan claro","Le explico que no es mi culpa","Cierro el ticket"], a:1, e:"Escucha activa + reconocer + plan claro con tiempos. El tono resuelve la mitad del conflicto."},
{s:"Escenarios", q:"No sabés cómo resolver un ticket. ¿Qué hacés?", o:["Invento una solución","Lo dejo sin responder","Reviso la knowledge base y tickets similares; si no, escalo con contexto y comunico el estatus","Lo cierro como resuelto"], a:2, e:"KB primero, escalar con contexto, nunca inventar ni dejar de comunicar."},
{s:"Escenarios", q:"Llegan 10 tickets a la vez. ¿Cómo priorizás?", o:["Por orden de llegada","Por impacto y urgencia: P1/P2 primero, mejoras al final; y comunico estatus a todos","Por el que grite más fuerte","Al azar"], a:1, e:"Impacto y urgencia, no orden de llegada. Comunicación: todos saben que su ticket está recibido."},
{s:"Escenarios", q:"¿Por qué este puesto si sos analista de datos?", o:["Porque no encontré nada mejor","Es el punto de contacto entre las personas y los datos: entiendo los reportes Y atiendo gente; quien entiende el ticket, entiende el negocio","Porque paga bien","No sabría decir"], a:1, e:"Esa es tu respuesta estrella: puente entre datos y personas, primer filtro del ciclo de datos."}
];

let i=0, score=0, done=[], answered=false;

function render(){
  const q=QS[i];
  document.getElementById('qText').textContent=q.q;
  document.getElementById('secLabel').textContent='📂 '+q.s;
  document.getElementById('counter').textContent=(i+1)+' / '+QS.length;
  document.getElementById('pbar').style.width=((i)/QS.length*100)+'%';
  const box=document.getElementById('opts');
  box.innerHTML='';
  q.o.forEach((opt,k)=>{
    const b=document.createElement('button');
    b.className='opt'; b.textContent=opt;
    b.onclick=()=>pick(k,b);
    box.appendChild(b);
  });
  const ex=document.getElementById('expl');
  ex.className='expl'; ex.innerHTML='';
  document.getElementById('nextBtn').disabled=true;
  answered=false;
}
function pick(k,btn){
  if(answered) return;
  answered=true;
  const q=QS[i], correct=k===q.a;
  if(correct) score++;
  done.push({s:q.s, q:q.q, ok:correct, yours:q.o[k], right:q.o[q.a], e:q.e});
  document.querySelectorAll('.opt').forEach((b,idx)=>{
    b.disabled=true;
    if(idx===q.a) b.classList.add('correct');
    if(idx===k && !correct) b.classList.add('wrong');
  });
  const ex=document.getElementById('expl');
  ex.className='expl show '+(correct?'good':'bad');
  ex.innerHTML='<p>'+(correct?'✅ <b>¡Correcto!</b>':'❌ <b>Incorrecto.</b> La respuesta correcta: <b>'+q.o[q.a]+'</b>')+'</p><p>'+q.e+'</p>';
  document.getElementById('nextBtn').disabled=false;
  document.getElementById('nextBtn').textContent=(i===QS.length-1)?'Ver mi nota 🏁':'Siguiente →';
}
function next(){
  i++;
  if(i<QS.length){ render(); }
  else { showResult(); }
}
function showResult(){
  document.getElementById('quizCard').style.display='none';
  document.getElementById('resultCard').style.display='block';
  const pct=Math.round(score/QS.length*100);
  document.getElementById('scoreNum').textContent=pct;
  let grade, verdict;
  if(pct>=90){ grade='🏆 ¡Excelente!'; verdict='Estás listo para la entrevista. Mañana vas con todo.'; }
  else if(pct>=75){ grade='🌟 Muy bien'; verdict='Sólido. Repasá las que fallaste y volvé a intentar para llegar a 90+.'; }
  else if(pct>=60){ grade='👍 Aceptable'; verdict='Vas bien, pero repasá las secciones con errores y reintentá.'; }
  else { grade='📚 Todavía no'; verdict='Necesitás estudiar más la guía. Repetí hasta sacar 90+.'; }
  document.getElementById('gradeLabel').textContent=grade;
  document.getElementById('verdict').textContent=verdict;
  // por sección
  const secs={};
  done.forEach(d=>{ (secs[d.s]=secs[d.s]||{ok:0,t:0}); secs[d.s].t++; if(d.ok) secs[d.s].ok++; });
  let sr='<h3 style="margin:12px 0 8px;font-size:15px;color:#0d2b45">Resultado por sección</h3>';
  for(const s in secs){
    const p=Math.round(secs[s].ok/secs[s].t*100);
    sr+='<div class="secbar"><div class="row"><span>'+s+'</span><span>'+secs[s].ok+'/'+secs[s].t+' ('+p+'%)</span></div><div class="track"><div style="width:'+p+'%"></div></div></div>';
  }
  document.getElementById('secResults').innerHTML=sr;
  // errores
  const errs=done.filter(d=>!d.ok);
  let m='';
  if(errs.length){
    m='<h3 style="margin:12px 0 8px;font-size:15px;color:#0d2b45">Repasá estas '+(errs.length>1?'preguntas':'pregunta')+'</h3>';
    errs.forEach(e=>{ m+='<div class="mistake"><b>'+e.q+'</b><br>Tu respuesta: '+e.yours+'<br>✅ Correcta: '+e.right+'<br><span style="color:#5a6b7c">'+e.e+'</span></div>'; });
  } else {
    m='<div class="card" style="background:#e8f5e9;border-left:4px solid #2e7d32;border-radius:8px;padding:12px"><b>🎯 Perfecto: cero errores.</b> Estás más que listo.</div>';
  }
  document.getElementById('mistakes').innerHTML=m;
  // mejor nota
  const best=localStorage.getItem('quizSoporteBest')||0;
  if(pct>best){ localStorage.setItem('quizSoporteBest',pct); }
  document.getElementById('bestBox').textContent='Mejor nota: '+Math.max(best,pct)+' / 100';
  window.scrollTo({top:0,behavior:'smooth'});
}
function restart(){
  i=0; score=0; done=[];
  document.getElementById('resultCard').style.display='none';
  document.getElementById('quizCard').style.display='block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
const best=localStorage.getItem('quizSoporteBest');
if(best) document.getElementById('bestBox').textContent='Mejor nota: '+best+' / 100';
render();
</script>
</body>
</html>
